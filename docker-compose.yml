services:
  db:
    image: postgres:18-alpine
    container_name: gophkeeper-postgres
    environment:
      POSTGRES_USER: gophkeeper
      POSTGRES_PASSWORD: gophkeeper
      POSTGRES_DB: gophkeeper
    ports:
      - "5432:5432"
    volumes:
      - gophkeeper-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophkeeper -d gophkeeper"]
      interval: 5s
      timeout: 5s
      retries: 5

  filestorage:
    image: minio/minio:latest
    container_name: gophkeeper-filestorage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gophkeeper-minio:/data

volumes:
  gophkeeper-pgdata:
  gophkeeper-minio:
